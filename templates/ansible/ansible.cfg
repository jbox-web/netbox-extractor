[defaults]
gathering = smart
stdout_callback = yaml

fact_caching = jsonfile
fact_caching_prefix = {{ caching_prefix }}
fact_caching_connection = {{ caching_connection }}
fact_caching_timeout = {{ caching_timeout }}

forks = {{ forks }}

host_key_checking = {{ host_key_checking | capitalize }}

deprecation_warnings = {{ deprecation_warnings | capitalize }}

# see: https://docs.ansible.com/ansible-core/2.19/reference_appendices/interpreter_discovery.html
interpreter_python = auto_legacy_silent

{% if use_mitogen == true %}
# configure mitogen
strategy_plugins = {{ mitogen_path }}
strategy = {{ mitogen_strategy }}
{% endif %}

[ssh_connection]
# Values below are interpolated raw into INI: a newline in one of them would
# split the line and inject a directive. They come from the operator's own
# config file, which is trusted here — the same file already decides what this
# tool connects to and generates. Do not wire an untrusted source into them.
pipelining = {{ pipelining | capitalize }}
ssh_args = {{ ssh_args }}
