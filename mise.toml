[settings]
aqua.registries = ["https://github.com/jbox-web/aqua-registry"]

[tools]
crystal = "1.20.3"
"aqua:elbywan/crystalline" = "0.18.0"
java = "openjdk-25"
python = "3.11.14"

[vars]
APP_NAME    = "netbox-extractor"
SOURCE_FILE = "src/{{vars.APP_NAME}}.cr"
OUTPUT_FILE = "{% if get_env(name='OUTPUT_FILE', default='false') == 'false' %}bin/{{vars.APP_NAME}}{% else %}{{ get_env(name='OUTPUT_FILE') }}{% endif %}"

DEFAULT_COMPILE_OPTS_DEV     = "--threads 4"
DEFAULT_COMPILE_OPTS_RELEASE = "--threads 4 --release --error-trace"

SPEC_OPTS            = "{% if exec(command='(tty -s && echo true) || echo false') == 'true' %}--verbose{% endif %}"
COMPILE_OPTS_DEV     = "{% if exec(command='(tty -s && echo true) || echo false') == 'true' %}{{vars.DEFAULT_COMPILE_OPTS_DEV}} --progress{% else %}{{vars.DEFAULT_COMPILE_OPTS_DEV}}{% endif %}"
COMPILE_OPTS_RELEASE = "{% if exec(command='(tty -s && echo true) || echo false') == 'true' %}{{vars.DEFAULT_COMPILE_OPTS_RELEASE}} --progress{% else %}{{vars.DEFAULT_COMPILE_OPTS_RELEASE}}{% endif %}"

OPENAPI_VERSION = "7.19.0"
OPENAPI_CLI_URL = "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/{{vars.OPENAPI_VERSION}}/openapi-generator-cli-{{vars.OPENAPI_VERSION}}.jar"

NETBOX_VERSION  = "4.4.10"
NETBOX_LIB_DIR  = "vendor/netbox-client"
NETBOX_PATCHES  = "vendor/netbox-client-patches"
NETBOX_API_FILE = "vendor/netbox-rest.{{vars.NETBOX_VERSION}}.yml"


#####################
# Development tasks #
#####################

[tasks."dev:build"]
description = "Compile to development binary"
run = "crystal build {{vars.COMPILE_OPTS_DEV}} -o {{vars.OUTPUT_FILE}} {{vars.SOURCE_FILE}}"

[tasks."dev:deps"]
description = "Install development dependencies"
run = "shards install"

[tasks."dev:clean"]
description = "Cleanup environment"
run = "rm -rf bin/* lib/"

[tasks."dev:spec"]
description = "Run Crystal spec"
run = "crystal spec {{vars.SPEC_OPTS}}"

[tasks."dev:spec-mt"]
description = "Run Crystal spec (multi-threaded)"
env = { CRYSTAL_WORKERS = "4" }
run = "crystal spec {{vars.SPEC_OPTS}} -Dpreview_mt"

[tasks."dev:docs"]
description = "Generate project documentation"
run = "rm -rf docs && crystal doc"

# ameba can spin at 100% CPU indefinitely on some inputs, so the task carries its
# own bound: the analysis is killed after 180s and the task fails with exit 124
# instead of running for hours unnoticed. Never call `bin/ameba` directly.
# `timeout` is GNU coreutils: present on the CI Linux runners, absent from macOS
# — /usr/bin/timeout does not exist there. Both CI templates install coreutils
# and put its gnubin first in the macOS jobs, so the task needs no platform
# branch; a macOS machine running it by hand needs `brew install coreutils` and
# that prefix on its PATH.
[tasks."dev:ameba"]
description = "Run static code analysis"
run = "timeout 180 bin/ameba"

[tasks."dev:format"]
description = "Format code"
# Restrict to project code: the vendored client is formatted by netbox-api:format.
run = "crystal tool format src spec"

[tasks."dev:format-check"]
description = "Check code formatting"
# Same restriction as dev:format: the vendored client is not ours to format.
run = "crystal tool format --check src spec"

[tasks."dev:docker-image"]
description = "Build local multiplatforms Docker image for local development"
run = "docker buildx bake docker-image"

# TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
[tasks."dev:fix-shards-command"]
description = "Fix missing shards command"
run = "cp $HOME/.local/share/mise/installs/crystal/{{tools.crystal.version}}/embedded/bin/shards $HOME/.local/share/mise/installs/crystal/{{tools.crystal.version}}/bin/"


#################
# Release tasks #
#################

[tasks."release:build"]
description = "Compile to production binary"
run = '''
crystal build {{vars.COMPILE_OPTS_RELEASE}} -o {{vars.OUTPUT_FILE}} {{vars.SOURCE_FILE}}
cd bin; for f in *; do shasum --algorithm 256 $f > $f.sha256; done
'''

[tasks."release:deps"]
description = "Install production dependencies"
run = "shards install --production"

[tasks."release:static"]
description = "Build static binary with Docker"
run = '''
docker buildx bake binary
mv packages/linux_arm64/{{vars.APP_NAME}}-linux-arm64 packages/
mv packages/linux_amd64/{{vars.APP_NAME}}-linux-amd64 packages/
rmdir packages/linux_arm64/ packages/linux_amd64/
rm -f packages/*.sha256
cd packages; for f in *; do shasum --algorithm 256 $f > $f.sha256; done
'''


################################
# Netbox API Development tasks #
################################

[tasks."netbox-api:build"]
description = "Download, generate, patch, format"
run = '''
mise netbox-api:generate
mise netbox-api:patch
mise netbox-api:format
'''

[tasks."netbox-api:download-openapi-cli"]
description = "Download OpenAPI jar"
run = "curl {{vars.OPENAPI_CLI_URL}} --output openapi-generator-cli.jar"

[tasks."netbox-api:generate"]
description = "Generate NetboxClient lib"
run = '''
rm -rf {{vars.NETBOX_LIB_DIR}}
export _JAVA_OPTIONS=-DmaxYamlCodePoints=99999999 && \
  java -jar openapi-generator-cli.jar generate \
  -i {{vars.NETBOX_API_FILE}} \
  -g crystal \
  -o {{vars.NETBOX_LIB_DIR}} \
  --additional-properties moduleName=NetboxClient \
  --additional-properties shardName=netbox-client
'''

[tasks."netbox-api:patch"]
description = "Patch NetboxClient code"
run = '''
git apply {{vars.NETBOX_PATCHES}}/*.diff
echo "ok"
'''

[tasks."netbox-api:create-patch"]
description = "Create patch for NetboxClient code"
run = "git diff vendor/ > {{vars.NETBOX_PATCHES}}/patch.diff"

[tasks."netbox-api:format"]
description = "Format NetboxClient code"
run = '''
crystal tool format {{vars.NETBOX_LIB_DIR}}/spec
crystal tool format {{vars.NETBOX_LIB_DIR}}/src
crystal tool format {{vars.NETBOX_LIB_DIR}}/spec
crystal tool format {{vars.NETBOX_LIB_DIR}}/src
'''
